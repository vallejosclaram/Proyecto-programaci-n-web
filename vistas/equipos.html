<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Equipos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <nav class="col-md-2 d-md-block sidebar p-3">
      <h3 class="text-white mb-4">UPE-SPORT</h3>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="pantalla-principal.html">Principal</a></li>
        <li class="nav-item"><a class="nav-link" href="visualizar-torneo.html">Torneos</a></li>
        <li class="nav-item"><a class="nav-link" href="ranking.html">Ranking</a></li>
        <li class="nav-item"><a class="nav-link" href="visualizar-perfil.html">Mi Perfil</a></li>
        <li class="nav-item"><a class="nav-link active" href="equipos.html">Equipos</a></li>
      </ul>
    </nav>

    <main class="col-md-10 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Equipos</h2>
        <a href="crear-equipo.html" class="btn btn-main">Crear Equipo</a>
      </div>

      <div class="mb-4 d-flex flex-wrap">
        <input type="text" id="buscarNombre" class="search-input" placeholder="Buscar por nombre">
        <select id="buscarJuego" class="search-input">
          <option value="">Filtrar por juego</option>
          <option value="League of Legends">League of Legends</option>
          <option value="Valorant">Valorant</option>
          <option value="CS2">CS2</option>
          <option value="Dota 2">Dota 2</option>
        </select>
        <button class="btn btn-main" id="btnBuscar">Buscar</button>
        <button class="btn btn-main ms-2" id="btnLimpiar">Limpiar</button>
      </div>

      <h4>Mis Equipos</h4>
      <div class="row" id="misEquipos"></div>

      <h4 class="mt-4">Equipos Disponibles</h4>
      <div class="row" id="otrosEquipos"></div>
    </main>
  </div>
</div>


<div class="modal fade" id="detalleEquipoModal" tabindex="-1" aria-labelledby="detalleEquipoLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="detalleEquipoLabel">Detalle del Equipo</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <p><strong>Nombre:</strong> <span id="modalNombre"></span></p>
        <p><strong>Juego:</strong> <span id="modalJuego"></span></p>
        <p><strong>Jugadores:</strong> <span id="modalJugadores"></span></p>
        <p><strong>Descripción:</strong></p>
        <p id="modalDescripcion" class="mb-0"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-main" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-main" id="btnInscribirse">Inscribirse</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="equipos.js"></script>
</body>
</html>

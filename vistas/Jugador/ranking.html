<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ranking de Torneos</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Roboto&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard-page">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="logo">🎮 UPE-SPORT</span>
      <button class="close-btn" id="closeBtn">✖</button>
    </div>
    <nav class="nav-links">
      <a href="dashboard.html" class="nav-item active">🏠 Dashboard</a>
      <a href="perfil/ver.html" class="nav-item">👤 Mi perfil</a>
      <a href="equipo/equipos.html" class="nav-item">🛡️ Equipos</a>
      <a href="torneo/torneo.html" class="nav-item">🏆 Torneos</a>
      <a href="ranking.html" class="nav-item">📊 Ranking</a>
    </nav>
    <div class="logout">
      <a href="../auth/login.html" class="nav-item logout-btn">🚪 Cerrar sesión</a>
    </div>
  </aside>
  <!-- overlay para cuando el sidebar está abierto (clic para cerrar) --> 
    <div id="sidebarOverlay" class="sidebar-overlay" tabindex="-1" aria-hidden="true"></div>
              <!-- TOPBAR --> 
    <header class="topbar"> 
      <!-- Izquierda --> 
      <div class="topbar-inner"> 
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" title="Abrir menú">☰</button> 
        <!-- Centro --> 
        <div class="topbar-center"> 
          <span class="topbar-logo">🎮 UPE-SPORT</span> 
        </div> 
        <!-- Derecha --> 
        <div id="usuarioResumen" class="usuario-resumen" aria-live="polite"> 
          <div id="usuarioNombre">Hola, Jugador</div> 
          <small id="usuarioRol" class="text-muted"></small> 
        </div> 
      </div> 
    </header> 

  <main class="main-content" id="mainContent">
    <h2>🏆 Ranking de Torneos</h2>
    <div class="filter-container">
    <button class="filter-btn active" data-filter="all">Todos</button>
    <button class="filter-btn" data-filter="player">Jugadores</button>
    <button class="filter-btn" data-filter="team">Equipos</button>
  </div>

  <div class="ranking-table-container">
    <table id="rankingTable">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Jugador / Equipo</th>
          <th>Juego</th>
          <th>Puntos</th>
        </tr>
      </thead>
      <tbody>
        <tr class="top1" data-type="player">
          <td>🥇 1</td>
          <td><img src="https://via.placeholder.com/32" alt="Fortnite" class="game-icon">PlayerX</td>
          <td>Fortnite</td>
          <td>2430</td>
        </tr>
        <tr class="top2" data-type="team">
          <td>🥈 2</td>
          <td><img src="https://via.placeholder.com/32" alt="Valorant" class="game-icon">ShadowTeam</td>
          <td>Valorant</td>
          <td>2300</td>
        </tr>
        <tr class="top3" data-type="player">
          <td>🥉 3</td>
          <td><img src="https://via.placeholder.com/32" alt="LoL" class="game-icon">Ghost</td>
          <td>LoL</td>
          <td>1980</td>
        </tr>
        <tr data-type="team">
          <td>4</td>
          <td><img src="https://via.placeholder.com/32" alt="CS:GO" class="game-icon">NightRaiders</td>
          <td>CS:GO</td>
          <td>1750</td>
        </tr>
        <tr data-type="player">
          <td>5</td>
          <td><img src="https://via.placeholder.com/32" alt="Minecraft" class="game-icon">BlockMaster</td>
          <td>Minecraft</td>
          <td>1600</td>
        </tr>
      </tbody>
    </table>
  </div>

  </main>

  <script src="ranking.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style-editar-perfil.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body>
<div class="container-fluid split-layout">
  <div class="row flex-nowrap">
    <nav class="col-auto sidebar p-3">
      <h3 class="text-white mb-4">UPE-SPORT</h3>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="pantalla-principal.html">Principal</a></li>
        <li class="nav-item"><a class="nav-link" href="visualizar-torneo.html">Torneos</a></li>
        <li class="nav-item"><a class="nav-link" href="ranking.html">Ranking</a></li>
        <li class="nav-item"><a class="nav-link active" href="visualizar-perfil.html">Mi Perfil</a></li>
        <li class="nav-item"><a class="nav-link" href="equipos.html">Equipos</a></li>
      </ul>
    </nav>

    <main class="col main-content p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Editar Perfil</h2>
        <a href="visualizar-perfil.html" class="btn btn-main">Volver a Perfil</a>
      </div>

      <div class="card-custom p-4">
        <form>
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="usuario" value="ProGamer123" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Correo</label>
            <input type="email" class="form-control" id="email" value="progamer@example.com" required>
          </div>
          <div class="mb-3">
            <label for="pais" class="form-label">País</label>
            <input type="text" class="form-control" id="pais" value="Argentina" required>
          </div>
          <div class="mb-3">
            <label for="bio" class="form-label">Biografía</label>
            <textarea class="form-control" id="bio" rows="3" required>Jugador competitivo de FPS y MOBA.</textarea>
          </div>
          <button type="submit" class="btn btn-main me-2">Guardar Cambios</button>
          <a href="visualizar-perfil.html" class="btn btn-outline-light">Cancelar</a>
        </form>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

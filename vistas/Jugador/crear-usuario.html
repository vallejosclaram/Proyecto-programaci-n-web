<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style-crear-usuario.css">
    <title>Document</title>
</head>
<body>
<div class="register-card">
    <h2 class="text-center">Crear Cuenta</h2>
    <form>

      <div class="col-md-6 mb-3">
          <label for="user" class="form-label">Usuario</label>
          <input type="text" class="form-control" id="user" placeholder="Tu G-User" required>
        </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label for="firstName" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="firstName" placeholder="Tu nombre" required>
        </div>
        <div class="col-md-6">
          <label for="lastName" class="form-label">Apellido</label>
          <input type="text" class="form-control" id="lastName" placeholder="Tu apellido" required>
        </div>
      </div>
    
      <div class="mt-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
      </div>
      <div class="mt-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" placeholder="********" required>
      </div>
      <div class="mt-3">
        <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
        <input type="password" class="form-control" id="confirmPassword" placeholder="********" required>
      </div>
      
      <button type="submit" class="btn w-100 mt-4 btn-register">Registrarme</button>
    </form>
    <div class="text-center mt-3">
      <p class="mb-0">¿Ya tienes cuenta? <a href="inicio-sesion.html" class="text-decoration-none">Inicia sesión</a></p>
    </div>
  </div>
  </body>
</html>

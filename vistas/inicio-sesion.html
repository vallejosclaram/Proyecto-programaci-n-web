<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style-iniciar-sesion.css">
    <script src="iniciar-sesion.js"> </script>
    <title>Inicio sesión</title>
</head>
<body>
    <div class="login-card">
    <h2 class="text-center">Iniciar Sesión</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
         <div class="invalid-feedback d-none" id="validemail">El email es incorrecto, ingrese uno válido</div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" placeholder="********" required>
        <div class="invalid-feedback d-none" id="validpass">Contraseña incorrecta</div>
      </div>
      <div class="d-flex justify-content-between mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label" for="remember">Recuérdame</label>
        </div>
        <a href="#" class="text-decoration-none">¿Olvidaste tu contraseña?</a>
      </div>
      <a href="#" id="enviar"><button type="submit"  class="btn w-100 btn-login">Entrar</button></a>
    </form>
    <div class="text-center mt-3">
      <p class="mb-0">¿No tienes cuenta? <a href="crear-usuario.html" class="text-decoration-none">Regístrate</a></p>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Equipo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <nav class="col-md-2 d-md-block sidebar p-3">
      <h3 class="text-white mb-4">Esports</h3>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="pantalla-principal.html">Principal</a></li>
        <li class="nav-item"><a class="nav-link" href="visualizar-torneo.html">Torneos</a></li>
        <li class="nav-item"><a class="nav-link" href="ranking.html">Ranking</a></li>
        <li class="nav-item"><a class="nav-link" href="visualizar-perfil.html">Mi Perfil</a></li>
        <li class="nav-item"><a class="nav-link active" href="equipos.html">Equipos</a></li>
      </ul>
    </nav>

    <!-- Contenido -->
    <main class="col-md-10 p-4">
      <h2 class="mb-4">Crear Equipo</h2>

      <div class="form-card">
        <form>
          <label for="teamName" class="form-label">Nombre del Equipo</label>
          <input type="text" class="form-control" id="teamName" placeholder="Escribe el nombre de tu equipo">

          <label for="gameSelect" class="form-label">Juego</label>
          <select id="gameSelect" class="form-select">
            <option value="">Selecciona un juego</option>
            <option value="LoL">League of Legends</option>
            <option value="Valorant">Valorant</option>
            <option value="CS2">CS2</option>
          </select>

          <label for="playersCount" class="form-label">Cantidad de Jugadores</label>
          <input type="number" class="form-control" id="playersCount" min="2" max="10" placeholder="Máximo 10 jugadores">

          <label for="region" class="form-label">Región (opcional)</label>
          <input type="text" class="form-control" id="region" placeholder="Ej: LATAM, NA, EU">

          <label for="description" class="form-label">Descripción del Equipo (opcional)</label>
          <textarea class="form-control" id="description" rows="3" placeholder="Slogan o información adicional"></textarea>

          <div class="d-flex justify-content-between mt-3">
            <a href="equipos.html" class="btn btn-main">Volver a Equipos</a>
            <button type="submit" class="btn btn-main">Crear Equipo</button>
          </div>
        </form>
      </div>

    </main>
  </div>
</div>


</body>
</html>

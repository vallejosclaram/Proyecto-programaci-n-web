<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Torneos - UPE-SPORT</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Roboto&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="mis-torneos.css" />
</head>
<body>
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="logo">🎮 UPE-SPORT</span>
      <button class="close-btn" id="closeBtn"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <nav class="nav-links">
      <a href="../dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i> Dashboard</a>
      <a href="../perfil/ver.html" class="nav-item"><i class="fa-solid fa-user" style="color:#c84dff;"></i> Mi perfil</a>
      <a href="mis-torneos.html" class="nav-item active"><i class="fa-solid fa-trophy" style="color:#ffb84d;"></i> Mis Torneos</a>
      <a href="../equipo/equipo.html" class="nav-item"><i class="fa-solid fa-people-group" style="color:#4dffb8;"></i> Equipos</a>
      <a href="../ranking.html" class="nav-item active"><i class="fa-solid fa-ranking-star" style="color:#ffb84d;"></i> Ranking</a>
      <a href="../solicitudes.html" class="nav-item"><i class="fa-solid fa-bell" style="color:#ff4d94;"></i> Solicitudes</a>
    </nav>

    <div class="logout">
      <a href="../auth/login.html" class="nav-item logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</a>
    </div>
  </aside>

  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <!-- ===== HEADER / TOPBAR ===== -->
  <header class="topbar">
    <div class="topbar-inner">
      <!-- Botón menú -->
      <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>

      <!-- Logo central -->
      <div class="topbar-center">
        <span class="topbar-logo">🎮 UPE-SPORT</span>
      </div>

      <!-- Usuario a la derecha -->
      <div id="usuarioResumen" class="usuario-resumen">
        <div id="usuarioNombre">Hola, Organizador</div>
        <small id="usuarioRol" class="text-muted"></small>
      </div>
    </div>
  </header>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <main class="main-content">
    <section class="torneos-section">
      <div class="torneos-header">
        <h2>Mis Torneos</h2>
        <button id="nuevoTorneoBtn" class="btn-nuevo-torneo" data-bs-toggle="modal" data-bs-target="#crearTorneoModal">
          <i class="fa-solid fa-plus"></i> Crear Torneo
        </button>
      </div>

      <div class="torneos-container">
        <div class="torneo-card">
          <img src="../assets/valorant.jpg" alt="Valorant">
          <h3>Valorant Masters</h3>
          <p><i class="fa-solid fa-calendar"></i> 25 Nov 2025</p>
          <p><i class="fa-solid fa-users"></i> 12 equipos</p>
          <div class="card-actions">
            <button class="btn-ver"><i class="fa-solid fa-eye"></i></button>
            <button class="btn-editar"><i class="fa-solid fa-pen"></i></button>
            <button class="btn-eliminar"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>

        <div class="torneo-card">
          <img src="../assets/fifa.jpg" alt="FIFA">
          <h3>FIFA Cup 2025</h3>
          <p><i class="fa-solid fa-calendar"></i> 12 Dic 2025</p>
          <p><i class="fa-solid fa-users"></i> 8 equipos</p>
          <div class="card-actions">
            <button class="btn-ver"><i class="fa-solid fa-eye"></i></button>
            <button class="btn-editar"><i class="fa-solid fa-pen"></i></button>
            <button class="btn-eliminar"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal Crear Torneo -->
<div class="modal fade" id="crearTorneoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-white rounded-3 shadow-lg border-0">
      <div class="modal-header border-0">
        <h5 class="modal-title">Crear Torneo</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" ></button>
      </div>
      <div class="modal-body">
        <form id="formCrearTorneo">
          <div class="mb-3">
            <label class="form-label">Nombre del Torneo</label>
            <input type="text" class="form-control bg-secondary text-white border-0 rounded-pill" placeholder="Ej: Valorant Championship" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Juego</label>
            <select class="form-select bg-secondary text-white border-0 rounded-pill" required>
              <option value="">Selecciona un juego</option>
              <option value="valorant">Valorant</option>
              <option value="fifa">FIFA</option>
              <option value="lol">League of Legends</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Fecha</label>
            <input type="date" class="form-control bg-secondary text-white border-0 rounded-pill" required>
          </div>
          <button type="submit" class="btn btn-purple w-100 rounded-pill">Crear Torneo</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
  <div id="toastTorneo" class="toast align-items-center text-white bg-purple border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">
        Torneo creado con éxito 🎉
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="mis-torneos.js"></script>
</body>
</html>
